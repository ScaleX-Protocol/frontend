name: 'Setup Node.js and pnpm with Caching'
description: 'Sets up Node.js with pnpm and intelligent caching for faster CI builds'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '9.0.0'

  filter:
    description: 'pnpm workspace filter (e.g., "web" to only install web dependencies)'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether dependencies were restored from cache'
    value: ${{ steps.cache-deps.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Cache pnpm store
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules/.pnpm
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-
          ${{ runner.os }}-pnpm-

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        
    - name: Configure pnpm for optimal performance
      shell: bash
      run: |
        pnpm config set store-dir ~/.pnpm-store
        pnpm config set network-timeout 300000
        pnpm config set fetch-retries 3
        pnpm config set fetch-retry-mintimeout 20000
        pnpm config set fetch-retry-maxtimeout 120000
        pnpm config set registry https://registry.npmjs.org/
        # Enable strict-peer-dependencies to fail fast on conflicts
        pnpm config set strict-peer-dependencies false
        
    - name: Install dependencies
      shell: bash
      run: |
        echo "🕐 Starting dependency installation (timeout: 15 minutes)..."
        start_time=$(date +%s)

        # Build install command with optional filter
        INSTALL_CMD="pnpm install --frozen-lockfile"
        if [ -n "${{ inputs.filter }}" ]; then
          echo "📦 Installing dependencies for workspace: ${{ inputs.filter }}"
          INSTALL_CMD="$INSTALL_CMD --filter ${{ inputs.filter }}"
        fi

        if [ "${{ steps.cache-deps.outputs.cache-hit }}" = "true" ]; then
          echo "📦 Dependencies restored from cache - running quick install..."
          $INSTALL_CMD --prefer-offline || {
            echo "⚠️ Cache install failed, retrying with full fetch..."
            $INSTALL_CMD
          }
        else
          echo "📥 Installing dependencies (cache miss) - this may take 5-10 minutes..."
          # Use default reporter for progress visibility on cache miss
          $INSTALL_CMD
        fi

        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "✅ Dependencies installed in ${duration} seconds"