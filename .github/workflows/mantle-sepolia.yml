name: Mantle Sepolia Frontend CI/CD

on:
  push:
    branches: [mantle-sepolia]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'turbo.json'
      - '.github/**'
  pull_request:
    branches: [mantle-sepolia]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'turbo.json'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      chain: mantle-sepolia
      domain: mantle-sepolia-app.scalex.money
      environment: mantle-sepolia
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
