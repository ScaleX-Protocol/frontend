name: Mantle Sepolia Frontend CI/CD

on:
  push:
    branches: [mantle-sepolia]
  pull_request:
    branches: [mantle-sepolia]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHAIN: mantle-sepolia
  DOMAIN: mantle-sepolia-app.scalex.money
  PORT: 3002

jobs:
  # Lint and Type Check for Mantle Sepolia
  lint:
    name: Lint & Type Check (Mantle Sepolia)
    runs-on: [self-hosted, scalex]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Setup Mantle Sepolia environment
        run: |
          cp .env.mantle-sepolia .env
          echo "NEXT_PUBLIC_DOMAIN=$DOMAIN" >> .env
          echo "NEXT_PUBLIC_BASE_URL=https://$DOMAIN" >> .env
        
      - name: Run linter
        run: pnpm run lint
        
      - name: Run type check
        run: pnpm run typecheck

  # Build Application for Mantle Sepolia
  build:
    name: Build Frontend (Mantle Sepolia)
    runs-on: [self-hosted, scalex]
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Setup Mantle Sepolia environment
        run: |
          cp .env.mantle-sepolia .env
          echo "NEXT_PUBLIC_DOMAIN=$DOMAIN" >> .env
          echo "NEXT_PUBLIC_BASE_URL=https://$DOMAIN" >> .env
          echo "NEXT_PUBLIC_BASE_URL=https://$DOMAIN" >> .env
        
      - name: Build application for Mantle Sepolia
        run: pnpm run build:mantle-sepolia
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files-mantle-sepolia
          path: |
            .next
            public
            package.json
          retention-days: 1

  # Security Audit
  security:
    name: Security Audit (Mantle Sepolia)
    runs-on: [self-hosted, scalex]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run security audit
        run: pnpm audit --audit-level moderate

  # Build and Push Docker Image for Mantle Sepolia
  docker-build:
    name: Build & Push Docker Image (Mantle Sepolia)
    runs-on: [self-hosted, scalex]
    needs: [build, security]
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=mantle-sepolia-
            type=raw,value=mantle-sepolia-latest
            type=semver,pattern={{version}}
            
      - name: Build and push Mantle Sepolia Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAIN=mantle-sepolia
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Mantle Sepolia
  deploy-mantle-sepolia:
    name: Deploy to Mantle Sepolia
    runs-on: [self-hosted, scalex]
    needs: [build, security]
    if: github.event_name == 'push'
    environment: mantle-sepolia
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/scalex-frontend
            
            # Pull latest changes
            git pull origin mantle-sepolia
            
            # Set up environment variables
            cp .env.mantle-sepolia .env
            
            # Deploy Mantle Sepolia stack
            docker-compose -f docker-compose.mantle-sepolia.yml pull
            docker-compose -f docker-compose.mantle-sepolia.yml down
            docker-compose -f docker-compose.mantle-sepolia.yml up -d
            
            # Wait for application to be ready (longer for Mantle)
            sleep 45
            
            # Health check
            timeout 90s bash -c 'until curl -f http://localhost:3002/api/health; do sleep 5; done'
            
                        
            # Show service status
            docker-compose -f docker-compose.mantle-sepolia.yml ps
            
      - name: Run Mantle Sepolia health check
        run: |
          sleep 45
          
          # Check health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" https://mantle-sepolia-app.scalex.money/api/health)
          if [ "$response" = "200" ]; then
            echo "✅ Mantle Sepolia API health check passed (HTTP $response)"
          else
            echo "❌ Mantle Sepolia API health check failed (HTTP $response)"
            exit 1
          fi
          
          # Check main application
          main_response=$(curl -s -o /dev/null -w "%{http_code}" https://mantle-sepolia-app.scalex.money)
          if [ "$main_response" = "200" ]; then
            echo "✅ Mantle Sepolia main app health check passed (HTTP $main_response)"
          else
            echo "❌ Mantle Sepolia main app health check failed (HTTP $main_response)"
            exit 1
          fi
          
          # Performance check
          start_time=$(date +%s%N)
          curl -s https://mantle-sepolia-app.scalex.money > /dev/null
          end_time=$(date +%s%N)
          response_time=$(echo "($end_time - $start_time) / 1000000" | bc)
          echo "📊 Mantle Sepolia response time: ${response_time}ms"
          
      - name: Verify Container Status
        run: |
          echo "=========================================="
          echo "🔍 CONTAINER VERIFICATION"
          echo "=========================================="
          
          echo ""
          echo "=== 1. CONTAINER STATUS CHECK ==="
          docker-compose -f docker-compose.mantle-sepolia.yml ps
          
          echo ""
          echo "=== 2. DETAILED CONTAINER INSPECTION ==="
          FRONTEND_STATUS=$(docker-compose -f docker-compose.mantle-sepolia.yml ps -q frontend-mantle-sepolia)
          if [ -n "$FRONTEND_STATUS" ]; then
            echo "✅ Frontend container is running: $FRONTEND_STATUS"
            
            echo ""
            echo "=== 3. CONTAINER HEALTH CHECK ==="
            # Test container internal health
            if docker-compose -f docker-compose.mantle-sepolia.yml exec -T frontend-mantle-sepolia curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Internal container health: PASS"
            else
              echo "❌ Internal container health: FAIL"
              echo "Container logs (last 15 lines):"
              docker-compose -f docker-compose.mantle-sepolia.yml logs --tail=15 frontend-mantle-sepolia
              exit 1
            fi
            
            echo ""
            echo "=== 4. RESOURCE USAGE ==="
            docker stats --no-stream frontend-mantle-sepolia || echo "Could not get container stats"
            
            echo ""
            echo "=== 5. LATEST LOGS ==="
            docker-compose -f docker-compose.mantle-sepolia.yml logs --tail=20 frontend-mantle-sepolia
          else
            echo "❌ Frontend container is NOT running"
            echo "Debugging container failure:"
            docker-compose -f docker-compose.mantle-sepolia.yml logs frontend-mantle-sepolia
            docker-compose -f docker-compose.mantle-sepolia.yml ps -a
            exit 1
          fi

  