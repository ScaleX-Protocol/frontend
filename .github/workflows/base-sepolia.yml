name: Base Sepolia Frontend CI/CD

on:
  push:
    branches: [base-sepolia]
  pull_request:
    branches: [base-sepolia]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHAIN: base-sepolia
  DOMAIN: base-sepolia-app.scalex.money
  PORT: 3001

jobs:
  # Lint and Type Check for Base Sepolia
  lint:
    name: Lint & Type Check (Base Sepolia)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Setup Base Sepolia environment
        run: |
          cp .env.base-sepolia .env
          echo "NEXT_PUBLIC_CHAIN_ID=84532" >> .env
          echo "NEXT_PUBLIC_CHAIN_NAME=Base Sepolia" >> .env
          echo "NEXT_PUBLIC_DOMAIN=$DOMAIN" >> .env
        
      - name: Run linter
        run: pnpm run lint
        
      - name: Run type check
        run: pnpm run typecheck

  # Build Application for Base Sepolia
  build:
    name: Build Frontend (Base Sepolia)
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Setup Base Sepolia environment
        run: |
          cp .env.base-sepolia .env
          echo "NEXT_PUBLIC_CHAIN_ID=84532" >> .env
          echo "NEXT_PUBLIC_CHAIN_NAME=Base Sepolia" >> .env
          echo "NEXT_PUBLIC_DOMAIN=$DOMAIN" >> .env
          echo "NEXT_PUBLIC_BASE_URL=https://$DOMAIN" >> .env
        
      - name: Build application for Base Sepolia
        run: pnpm run build:base-sepolia
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files-base-sepolia
          path: |
            .next
            public
            package.json
          retention-days: 1

  # Security Audit
  security:
    name: Security Audit (Base Sepolia)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run security audit
        run: pnpm audit --audit-level moderate

  # Build and Push Docker Image for Base Sepolia
  docker-build:
    name: Build & Push Docker Image (Base Sepolia)
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=base-sepolia-
            type=raw,value=base-sepolia-latest
            type=semver,pattern={{version}}
            
      - name: Build and push Base Sepolia Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAIN=base-sepolia
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Base Sepolia
  deploy-base-sepolia:
    name: Deploy to Base Sepolia
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'
    environment: base-sepolia
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Base Sepolia server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/scalex-frontend
            
            # Pull latest changes
            git pull origin base-sepolia
            
            # Set up environment variables
            cp .env.base-sepolia .env
            
            # Deploy Base Sepolia stack
            docker-compose -f docker-compose.base-sepolia.yml pull
            docker-compose -f docker-compose.base-sepolia.yml down
            docker-compose -f docker-compose.base-sepolia.yml up -d
            
            # Wait for application to be ready
            sleep 30
            
            # Health check
            timeout 60s bash -c 'until curl -f http://localhost:3001/api/health; do sleep 5; done'
            
                        
            # Show service status
            docker-compose -f docker-compose.base-sepolia.yml ps
            
      - name: Run Base Sepolia health check
        run: |
          sleep 30
          
          # Check health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" https://base-sepolia-app.scalex.money/api/health)
          if [ "$response" = "200" ]; then
            echo "✅ Base Sepolia API health check passed (HTTP $response)"
          else
            echo "❌ Base Sepolia API health check failed (HTTP $response)"
            exit 1
          fi
          
          # Check main application
          main_response=$(curl -s -o /dev/null -w "%{http_code}" https://base-sepolia-app.scalex.money)
          if [ "$main_response" = "200" ]; then
            echo "✅ Base Sepolia main app health check passed (HTTP $main_response)"
          else
            echo "❌ Base Sepolia main app health check failed (HTTP $main_response)"
            exit 1
          fi
          
          # Performance check
          start_time=$(date +%s%N)
          curl -s https://base-sepolia-app.scalex.money > /dev/null
          end_time=$(date +%s%N)
          response_time=$(echo "($end_time - $start_time) / 1000000" | bc)
          echo "📊 Base Sepolia response time: ${response_time}ms"

  