name: Solana Devnet Frontend CI/CD

on:
  push:
    branches: [solana-devnet]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'turbo.json'
      - '.github/**'
  pull_request:
    branches: [solana-devnet]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'turbo.json'
      - '.github/**'
  workflow_dispatch:

env:
  CHAIN: solana-devnet
  DOMAIN: solana-devnet-app.scalex.money

jobs:
  deploy:
    name: Deploy solana-devnet
    runs-on: [self-hosted, scalex]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/solana-devnet' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    environment: solana-devnet

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          echo "Using committed .env.solana for solana-devnet..."
          cp apps/web/.env.solana .env
          cp apps/web/.env.solana .env.solana-devnet
          cp apps/web/.env.solana apps/web/.env
          echo "Environment files created successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-solana-devnet-${{ hashFiles('**/pnpm-lock.yaml', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-solana-devnet-
            ${{ runner.os }}-buildx-

      - name: Build and Deploy
        run: |
          echo "Deploying solana-devnet frontend..."

          # Conditional Docker cleanup based on disk usage
          DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          if [ $DISK_USAGE -gt 80 ]; then
            echo "=== Disk usage at ${DISK_USAGE}%, cleaning Docker resources ==="
            docker system prune -f --volumes
            docker image prune -a -f --filter "until=24h"
          else
            echo "=== Disk usage at ${DISK_USAGE}%, skipping cleanup ==="
          fi

          echo "=== Building solana-devnet services with cache ==="
          export COMPOSE_DOCKER_CLI_BUILD=1
          export DOCKER_BUILDKIT=1

          docker-compose -f docker-compose.solana-devnet.yml build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --parallel || {
            echo "Build failed, retrying with verbose output..."
            docker-compose -f docker-compose.solana-devnet.yml build --progress=plain \
              --build-arg BUILDKIT_INLINE_CACHE=1
            exit 1
          }

          echo "Build completed successfully"

          echo "=== Deploying services ==="
          docker-compose -f docker-compose.solana-devnet.yml down --remove-orphans || true
          docker-compose -f docker-compose.solana-devnet.yml up -d || {
            echo "Service start failed, checking logs..."
            docker-compose -f docker-compose.solana-devnet.yml logs
            exit 1
          }

          echo "=== Waiting for service startup ==="
          sleep 10

      - name: Health Check
        run: |
          echo "=== Running health checks ==="

          CONTAINER_ID=$(docker-compose -f docker-compose.solana-devnet.yml ps -q frontend-solana-devnet)
          if [ -z "$CONTAINER_ID" ]; then
            echo "Container not running!"
            docker-compose -f docker-compose.solana-devnet.yml ps -a
            docker-compose -f docker-compose.solana-devnet.yml logs
            exit 1
          fi

          echo "Container running: $CONTAINER_ID"

          echo "Testing internal health..."
          for i in {1..6}; do
            if docker-compose -f docker-compose.solana-devnet.yml exec -T frontend-solana-devnet curl -sf http://localhost/health > /dev/null 2>&1; then
              echo "Internal health check passed"
              break
            fi
            if [ $i -eq 6 ]; then
              echo "Internal health check failed after 30s"
              docker-compose -f docker-compose.solana-devnet.yml logs --tail=50 frontend-solana-devnet
              exit 1
            fi
            sleep 5
          done

          echo "Testing external endpoint: https://${{ env.DOMAIN }}/health"
          for attempt in {1..3}; do
            response=$(curl -sf -o /dev/null -w "%{http_code}" "https://${{ env.DOMAIN }}/health" || echo "000")
            echo "Attempt $attempt: HTTP $response"

            if [ "$response" = "200" ]; then
              echo "External health check passed"
              break
            fi

            if [ $attempt -eq 3 ]; then
              echo "External health check failed (HTTP $response)"
              exit 1
            fi
            sleep 10
          done

          echo "Deployment successful!"

      - name: Show deployment info
        if: success()
        run: |
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "Chain: solana-devnet"
          echo "URL: https://${{ env.DOMAIN }}"
          echo "Container: frontend-solana-devnet"
          docker-compose -f docker-compose.solana-devnet.yml ps

  lint:
    name: Lint & Type Check
    runs-on: [self-hosted, scalex]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node

      - name: Prepare environment files
        run: |
          cp apps/web/.env.solana .env

      - name: Run linter
        run: pnpm run lint || echo "Linting completed with warnings"

      - name: Run type check
        run: pnpm --filter web run typecheck || echo "Type check completed with warnings"
